name: Fix Strategic Roadmap Utilization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply utilization fix
        run: python fix_roadmap_utilization.py
      - name: Validate Python
        run: python -m py_compile strategic_roadmap.py
      - name: Confirm fix
        run: |
          grep -q 'positive_capacity = capacity > 0' strategic_roadmap.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategic_roadmap.py
          git diff --cached --quiet || git commit -m "Fix strategic roadmap utilization calculation"
          git push
