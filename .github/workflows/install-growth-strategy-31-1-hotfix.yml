name: Install Growth Strategy 31.1 Hotfix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply visibility and form-reset hotfix
        run: python install_gs31_1_hotfix.py
      - name: Validate
        run: |
          python -m py_compile growth_strategy_30.py growth_governance_31.py
          grep -q 'sharing=="Everyone"' growth_governance_31.py
          grep -q 'startswith(prefix)' growth_strategy_30.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth_strategy_30.py growth_governance_31.py
          git diff --cached --quiet || git commit -m "Fix strategy visibility and reset creation fields"
          git push
