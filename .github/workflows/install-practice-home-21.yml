name: Install Practice Home 21
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Practice Attention Dashboard
        run: python install_practice_home_21.py
      - name: Validate
        run: |
          python -m py_compile app.py practice_home_dashboard.py
          grep -q 'render_practice_home(extra, user)' app.py
          grep -q 'Practice Attention Dashboard' practice_home_dashboard.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py practice_home_dashboard.py
          git diff --cached --quiet || git commit -m "Install actionable Practice Home dashboard"
          git push
