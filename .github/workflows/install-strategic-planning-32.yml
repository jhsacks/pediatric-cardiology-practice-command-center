name: Install Strategic Planning 32
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python install_sp32.py
      - run: |
          python -m py_compile strategic_planning.py scenario_workforce_32.py growth_strategy_30.py
          grep -q 'Workforce & Schedule' strategic_planning.py
          grep -q 'render_scenario_workforce' strategic_planning.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategic_planning.py scenario_workforce_32.py growth_strategy_30.py
          git diff --cached --quiet || git commit -m "Install scenario workforce and schedule engine"
          git push
