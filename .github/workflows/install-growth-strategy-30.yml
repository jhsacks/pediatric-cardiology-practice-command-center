name: Install Growth Strategy 30
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python install_growth30.py
      - run: python -m py_compile growth_strategy.py growth_strategy_30.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth_strategy.py growth_strategy_30.py
          git diff --cached --quiet || git commit -m "Install connected Growth Strategy 30 engine"
          git push
