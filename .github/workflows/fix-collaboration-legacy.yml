name: Fix Collaboration Legacy Data
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fix_collaboration_legacy.py
      - run: python -m py_compile collaboration_governance.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collaboration_governance.py
          git diff --cached --quiet || git commit -m "Fix legacy collaboration records"
          git push
