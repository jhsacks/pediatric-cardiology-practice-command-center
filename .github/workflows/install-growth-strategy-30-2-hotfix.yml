name: Growth Strategy 30.2 Emergency Hotfix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python install_growth30_2_hotfix.py
      - run: |
          python -m py_compile growth_strategy_30.py
          grep -q 'def safe_number' growth_strategy_30.py
          grep -q 'capacity = safe_number' growth_strategy_30.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth_strategy_30.py
          git diff --cached --quiet || git commit -m "Growth Strategy 30.2 emergency hotfix"
          git push
