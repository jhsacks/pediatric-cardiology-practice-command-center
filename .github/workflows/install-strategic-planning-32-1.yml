name: Install Strategic Planning 32.1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python install_sp32_1.py
      - run: |
          python -m py_compile strategic_planning.py personal_scenarios.py scenario_capacity_32_1.py
          grep -q 'render_capacity_summary' personal_scenarios.py
          grep -q 'render_capacity_summary' strategic_planning.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategic_planning.py personal_scenarios.py scenario_capacity_32_1.py
          git diff --cached --quiet || git commit -m "Add live provider-day capacity to scenarios"
          git push
