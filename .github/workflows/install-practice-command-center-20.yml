name: Install Practice Command Center 20
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python install_practice_20.py
      - run: python -m py_compile app.py collaboration_governance.py strategic_planning.py strategic_portfolio.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py collaboration_governance.py strategic_planning.py strategic_portfolio.py
          git diff --cached --quiet || git commit -m "Install synchronized Practice Command Center 20"
          git push
