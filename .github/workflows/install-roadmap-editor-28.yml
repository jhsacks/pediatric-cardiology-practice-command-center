name: Install Roadmap Editor 28
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python install_roadmap_editor_28.py
      - run: |
          python -m py_compile growth_strategy.py roadmap_editor.py
          grep -q 'Create Roadmap Item' roadmap_editor.py
          grep -q 'Delete Permanently' roadmap_editor.py
          grep -q 'render_roadmap_editor' growth_strategy.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth_strategy.py roadmap_editor.py
          git diff --cached --quiet || git commit -m "Install editable Growth Strategy roadmap"
          git push
