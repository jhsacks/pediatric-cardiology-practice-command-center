name: Install Growth Strategy 26
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python install_growth_26.py
      - run: python -m py_compile app.py growth_strategy.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py growth_strategy.py
          git diff --cached --quiet || git commit -m "Install conversational growth strategy studio"
          git push
